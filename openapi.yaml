openapi: 3.0.3

info:
  title: Todo API
  version: 1.0.0
  note: Todo management and authentication API

servers:
  - url: http://localhost:3000

tags:
  - name: Auth
    note: Authentication
  - name: Todo
    note: Todo management

paths:
  /service/auth/signup:
    post:
      tags:
        - Auth
      summary: Sign up
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              account: testuser
              password: P@55w0rd
              confirmPassword: P@55w0rd
      responses:
        '200':
          note: Signup succeeded
        '400':
          note: Invalid request
        '409':
          note: Account already exists

  /service/auth/signin:
    post:
      tags:
        - Auth
      summary: Sign in
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
            example:
              account: testuser
              password: P@55w0rd
      responses:
        '200':
          note: Signin succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIs...
        '400':
          note: Invalid request
        '401':
          note: Authentication failed

  /service/todo:
    put:
      tags:
        - Todo
      summary: Create a Todo
      operationId: createTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
            example:
              due: '2026-09-12T00:00:00Z'
              title: test title
              note: test note
      responses:
        '200':
          note: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              example:
                id: 01234567-89ab-cdef-0123-456789abcdef
                due: '2026-09-12T00:00:00Z'
                title: test title
                note: test note
        '400':
          note: Invalid request
        '401':
          note: Authentication required

    post:
      tags:
        - Todo
      summary: Update a Todo
      operationId: updateTodo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdateRequest'
            example:
              id: 01234567-89ab-cdef-0123-456789abcdef
              due: '2026-09-13T00:00:00Z'
              title: change title
              note: change note
      responses:
        '200':
          note: Todo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          note: Invalid request
        '401':
          note: Authentication required
        '404':
          note: Todo not found

  /service/todo/list:
    get:
      tags:
        - Todo
      summary: Get Todo list
      operationId: getTodoList
      security:
        - bearerAuth: []
      responses:
        '200':
          note: Todo list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '401':
          note: Authentication required

  /service/todo/{id}:
    delete:
      tags:
        - Todo
      summary: Delete a Todo
      operationId: deleteTodo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          note: Todo ID
          schema:
            type: string
            format: uuid25
      responses:
        '200':
          note: Todo deleted
        '401':
          note: Authentication required
        '404':
          note: Todo not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      required:
        - account
        - password
        - confirmPassword
        - email
        - name
      properties:
        account:
          type: string
          example: testuser
        password:
          type: string
          format: password
          example: P@55w0rd
        confirmPassword:
          type: string
          format: password
          example: P@55w0rd
        email:
          type: string
          format: email
          example: 3oV2u@example.com
        name:
          type: string
          example: Test User

    SigninRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          example: testuser
        password:
          type: string
          format: password
          example: P@55w0rd

    SigninResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          note: JWT access token

    TodoRequest:
      type: object
      required:
        - due
        - title
        - note
      properties:
        due:
          type: string
          format: date-time
          example: '2026-09-12T00:00:00Z'
        title:
          type: string
          example: test title
        note:
          type: string
          example: test note

    TodoUpdateRequest:
      type: object
      required:
        - id
        - due
        - title
        - note
      properties:
        id:
          type: string
          format: uuid
          example: 01234567-89ab-cdef-0123-456789abcdef
        due:
          type: string
          format: date-time
          example: '2026-09-13T00:00:00Z'
        title:
          type: string
          example: change title
        note:
          type: string
          example: change note

    Todo:
      type: object
      required:
        - id
        - due
        - done
        - title
        - note
      properties:
        id:
          type: string
          format: uuid25
        due:
          type: string
          format: date-time
        done:
          type: boolean
        title:
          type: string
        note:
          type: string
